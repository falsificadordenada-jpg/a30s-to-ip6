name: xnu4903

on:
  workflow_dispatch:
    inputs:
      xnu_tag:
        description: "Tag do xnu (4903 = macOS 10.14.6 / iOS 12)"
        default: "xnu-4903.270.47"
      kernel_config:
        description: "RELEASE / DEVELOPMENT / DEBUG"
        default: "DEVELOPMENT"
      machine_config:
        description: "T7000 = A8 (iPhone 6). Outras: S5L8960X (A7), S8000 (A9)"
        default: "T7000"
      sdk:
        description: "iphoneos (recomendado) ou macosx"
        default: "iphoneos"
      keep_going:
        description: "make -k: continua apos erro para listar todos de uma vez"
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - "ci/**"
      - ".github/workflows/xnu4903.yml"

concurrency:
  group: xnu4903-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Escolher Xcode mais antigo da imagem
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          ls -d /Applications/Xcode*.app

      - name: Compilar XNU
        env:
          XNU_TAG: ${{ inputs.xnu_tag || 'xnu-4903.270.47' }}
          KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
          MACHINE_CONFIG: ${{ inputs.machine_config || 'T7000' }}
          SDK: ${{ inputs.sdk || 'iphoneos' }}
          MAKE_KEEP_GOING: ${{ inputs.keep_going == 'false' && '' || '1' }}
        run: |
          bash ci/build4903.sh 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}

      - name: Empacotar arvore de build (so texto/headers) para depurar
        if: always()
        run: |
          tar czf buildtree.tgz --exclude='*.o' --exclude='*.a' --exclude='*.dSYM' --exclude='.git' \
            -C work build fakeroot/usr/local/include 2>/dev/null || true
          ls -la buildtree.tgz || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu4903-logs
          path: |
            build.log
            out/*.log
            out/report.txt
            buildtree.tgz
          retention-days: 14
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu4903-kernel
          path: out/kernel/
          retention-days: 30
          if-no-files-found: warn
